name: Build and release fork

on:
  push:
    tags: ['fixes-*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: python3 scripts/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: browser-packages
          path: release-artifacts/*
          if-no-files-found: error
      - name: Publish browser packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./plugin/manifest.json').version")
          release_tag="fixes-$version"
          if [ "$RELEASE_REF_TYPE" = tag ] && [ "$RELEASE_REF_NAME" != "$release_tag" ]; then
            echo "Release tag must match manifest version: $release_tag"
            exit 1
          fi
          if gh release view "$release_tag" > /dev/null 2>&1; then
            gh release upload "$release_tag" release-artifacts/* --clobber
          else
            gh release create "$release_tag" release-artifacts/* --target "$GITHUB_SHA" --title "WebToEpubFix $version — parser fixes" --notes-file RELEASE_NOTES.md --prerelease
          fi
